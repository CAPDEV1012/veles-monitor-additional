<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Veles Monitor scope insignia">
  <defs>
    <radialGradient id="scopeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wolfShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5BC8FA"/>
      <stop offset="100%" stop-color="#1F8FCC"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="120" fill="url(#scopeGlow)"/>

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="110" stroke="#38BDF8" stroke-width="2.5" fill="none"/>

  <!-- Mid ring (dashed range indicators) -->
  <circle cx="128" cy="128" r="86" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 5" opacity="0.55" fill="none"/>

  <!-- Outer tick marks every 30° -->
  <g stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round">
    <line x1="128" y1="10" x2="128" y2="26"/>
    <line x1="128" y1="230" x2="128" y2="246"/>
    <line x1="10" y1="128" x2="26" y2="128"/>
    <line x1="230" y1="128" x2="246" y2="128"/>
  </g>
  <g stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
    <line x1="187" y1="26.2" x2="180" y2="38.3"/>
    <line x1="68.8" y1="26.2" x2="75.9" y2="38.3"/>
    <line x1="187" y1="229.8" x2="180" y2="217.7"/>
    <line x1="68.8" y1="229.8" x2="75.9" y2="217.7"/>
    <line x1="229.8" y1="68.8" x2="217.7" y2="75.9"/>
    <line x1="26.2" y1="68.8" x2="38.3" y2="75.9"/>
    <line x1="229.8" y1="187" x2="217.7" y2="180"/>
    <line x1="26.2" y1="187" x2="38.3" y2="180"/>
  </g>

  <!-- Reticle crosshair -->
  <g stroke="#38BDF8" stroke-width="1.1" opacity="0.4">
    <line x1="48" y1="128" x2="208" y2="128"/>
    <line x1="128" y1="48" x2="128" y2="208"/>
  </g>

  <!-- Wolf head (geometric, front-facing) -->
  <g>
    <!-- Ears -->
    <path d="M 86 86 L 76 54 L 108 78 Z" fill="url(#wolfShade)"/>
    <path d="M 170 86 L 180 54 L 148 78 Z" fill="url(#wolfShade)"/>
    <!-- Inner ear shading -->
    <path d="M 90 82 L 84 62 L 100 78 Z" fill="#0A1628" opacity="0.45"/>
    <path d="M 166 82 L 172 62 L 156 78 Z" fill="#0A1628" opacity="0.45"/>

    <!-- Main head shape -->
    <path d="M 128 64 L 88 82 L 76 124 L 92 168 L 128 192 L 164 168 L 180 124 L 168 82 Z" fill="url(#wolfShade)"/>

    <!-- Cheek fur accents -->
    <path d="M 76 124 L 84 132 L 92 168 L 80 152 Z" fill="#0A1628" opacity="0.25"/>
    <path d="M 180 124 L 172 132 L 164 168 L 176 152 Z" fill="#0A1628" opacity="0.25"/>

    <!-- Eyes (cyan glow) -->
    <path d="M 100 116 L 122 110 L 118 128 L 102 124 Z" fill="#0A1628"/>
    <path d="M 134 110 L 156 116 L 154 124 L 138 128 Z" fill="#0A1628"/>
    <path d="M 106 117 L 118 114 L 116 122 L 108 121 Z" fill="#38BDF8"/>
    <path d="M 138 114 L 150 117 L 148 121 L 140 122 Z" fill="#38BDF8"/>

    <!-- Snout -->
    <path d="M 116 148 L 140 148 L 134 168 L 122 168 Z" fill="#0A1628"/>
    <path d="M 122 156 L 134 156 L 132 164 L 124 164 Z" fill="#5BC8FA" opacity="0.18"/>

    <!-- Nose -->
    <path d="M 122 148 L 134 148 L 132 154 L 124 154 Z" fill="#5BC8FA"/>

    <!-- Mouth slit -->
    <line x1="128" y1="168" x2="128" y2="180" stroke="#0A1628" stroke-width="2"/>
  </g>

  <!-- Center marker dot -->
  <circle cx="128" cy="128" r="1.8" fill="#38BDF8" opacity="0"/>
</svg>
